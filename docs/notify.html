<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카카오 조황 알림 | 선상 조황 알리미</title><meta name="description" content="카카오 로그인 후 원하는 선박의 새 조황 알림을 설정합니다."><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="wrap header-inner"><a class="logo" href="index.html"><span>🎣</span><span>선상 조황 알리미</span></a><nav class="nav"><a href="index.html">최신 업데이트</a><a href="boats.html">선박 비교</a><a href="insights.html">데이터 인사이트</a><a href="guide.html">낚시 가이드</a><a href="notify.html">카카오 알림</a><a href="about.html">서비스 소개</a></nav></div></header><main class="wrap content"><div class="notify-wrap"><div class="eyebrow">Kakao alert</div><h1>카카오 조황 알림</h1><p class="muted">카카오로 로그인한 뒤 원하는 선박을 선택하세요.</p><div class="notify-box" id="loginBox"><h2>1. 카카오 로그인</h2><a class="kakao-login" id="loginBtn" href="#">카카오로 시작하기</a></div><div class="notify-box" id="settingsBox" style="display:none"><h2>2. 알림 받을 선박 선택</h2><p id="hello" class="muted"></p><div id="boats"></div><label class="consent"><input type="checkbox" id="consent"><span><strong>조황 알림 수신에 동의합니다.</strong></span></label><button class="save-btn" id="saveBtn">알림 설정 저장</button><div class="status" id="status"></div></div></div></main><script>const API='https://umdkypcbdcrerhfnnybi.supabase.co/functions/v1/kakao-auth';const loginBox=document.getElementById('loginBox'),settingsBox=document.getElementById('settingsBox'),boatsEl=document.getElementById('boats'),consentEl=document.getElementById('consent'),statusEl=document.getElementById('status');document.getElementById('loginBtn').href=API+'?op=login';const h=new URLSearchParams(location.hash.replace(/^#/,''));if(h.get('session')){localStorage.setItem('kakao_notify_session',h.get('session'));history.replaceState(null,'',location.pathname)}function token(){return localStorage.getItem('kakao_notify_session')||''}async function load(){if(!token())return;const r=await fetch(API+'?op=status',{headers:{'x-session-token':token()}});if(!r.ok)return;const d=await r.json();loginBox.style.display='none';settingsBox.style.display='block';document.getElementById('hello').textContent='알림 받을 선박을 선택하세요.';consentEl.checked=!!d.user?.notification_consent;(d.boats||[]).forEach(b=>{const l=document.createElement('label');l.className='boat-row';l.innerHTML='<input type="checkbox" value="'+b.id+'" '+(b.selected?'checked':'')+'><strong>'+b.name+'</strong>';boatsEl.appendChild(l)})}document.getElementById('saveBtn').onclick=async()=>{const boat_ids=[...boatsEl.querySelectorAll('input:checked')].map(x=>x.value);if(!consentEl.checked){statusEl.textContent='알림 수신 동의에 체크해주세요.';statusEl.style.display='block';return}const r=await fetch(API+'?op=save',{method:'POST',headers:{'content-type':'application/json','x-session-token':token()},body:JSON.stringify({boat_ids,notification_consent:true})});statusEl.textContent=r.ok?'저장되었습니다.':'저장 중 오류가 발생했습니다.';statusEl.style.display='block'};load();</script><footer><div class="wrap footer-grid"><div><strong>선상 조황 알리미</strong><p>외부 조황 원문을 복제하지 않고 새 게시 여부와 자체 집계만 제공합니다.</p></div><div class="footer-links"><a href="copyright.html">저작권·출처 정책</a><a href="privacy.html">개인정보처리방침</a><a href="terms.html">이용약관</a><a href="contact.html">문의</a></div></div></footer></body></html>
