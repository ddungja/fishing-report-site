name: Update fishing report site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_site.py"
      - "sources.json"
      - ".github/workflows/update-site.yml"
  schedule:
    - cron: "20 22 * * *"

permissions:
  contents: write

concurrency:
  group: fishing-site-build
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate site
        env:
          BASE_URL: https://ddungja.github.io/fishing-report-site
        run: python generate_site.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update fishing reports"
            git push
          fi
